# R40（自動生成。手で編集しない）。r39_bim/bim_E2_plan_correlate.yaml の source と試行数（50）だけを替えた
source:
  type: points_ply
  mesh_path: output/R40_BIM/Owall_25.ply
reference:
  type: ifc
  path: BIM_IFC_Extraction/input/m3-411.ifc
  spaces:
  - '411'
  storeys:
  - 4FL
  space_margin_m: 0.35
  n_points: 200000
  keep_classes:
  - wall
  - floor
  - ceiling
  - door
  - window
  inner_only: true
  cache_path: Registration/output/ifc/m3_ifc_411.npz
classes:
  names:
  - background
  - wall
  - door
  - floor
  - window
  - ceiling
  palette:
    background:
    - 128
    - 128
    - 128
    wall:
    - 255
    - 64
    - 64
    door:
    - 255
    - 200
    - 64
    floor:
    - 180
    - 220
    - 255
    window:
    - 64
    - 200
    - 255
    ceiling:
    - 200
    - 100
    - 255
  replica_to_six:
    93: wall
    37: door
    40: floor
    97: window
    31: ceiling
  ifc_class_map:
    IfcWall: wall
    IfcWallStandardCase: wall
    IfcCurtainWall: wall
    IfcDoor: door
    IfcWindow: window
    IfcSlab:
      predefined_type:
        FLOOR: floor
        BASESLAB: floor
        _default: background
    IfcCovering:
      predefined_type:
        CEILING: ceiling
        _default: background
    IfcColumn: background
    IfcBeam: background
    IfcRailing: background
    IfcFurnishingElement: background
    IfcBuildingElementProxy: background
    IfcStair: background
    IfcStairFlight: background
    IfcPlate: background
    IfcMember: background
    IfcFlowTerminal: background
    _default: background
  structural:
  - wall
  - floor
  - ceiling
  match_classes:
  - wall
  - floor
  - ceiling
  - door
  - window
preprocess:
  voxel_size: 0.05
  normal_radius: 0.15
  normal_max_nn: 50
rotation:
  ransac_iters: 1000
  ransac_normal_thresh_deg: 5.0
  yaw_bins: 360
  yaw_use_kmeans: true
semantic_icp:
  max_iter: 50
  max_corr_dist: 0.3
  tukey_c: 0.3
  with_scaling: true
  rotation_fixed: false
  convergence_delta: 1.0e-05
proposed:
  scale_init: median_axes
  translation_init: plan_correlate
baseline_open3d:
  voxel_size: 0.05
  fpfh_radius: 0.25
  fpfh_max_nn: 100
  ransac_dist: 0.075
  ransac_n: 4
  ransac_iters: 4000000
  ransac_confidence: 0.999
  icp_dist: 0.15
eval:
  trials: 50
  seed: 0
  perturb:
    rot_deg:
    - 0.0
    - 180.0
    trans:
    - -2.0
    - 2.0
    log_scale:
    - -0.4
    - 0.4
  success:
    rot_deg: 5.0
    trans: 0.1
    scale_ratio: 0.05
  out_dir: output/Registration/r40_bim/err_Owall_25
  t_gt_path: output/R39_BIM/T_gt_bim.json
adopted_method: proposed
