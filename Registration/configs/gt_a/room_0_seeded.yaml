# GT-A 評価用の config（R27 §2-2。自動生成。手で編集しない）
#
# **sectionC/room_0.yaml の写しで、source と t_gt_path だけ差し替えてある。**
# 手法のパラメータ・摂動範囲・成功閾値は sectionC と同一。
#
# 正解 T_gt は **我々が掛けた既知の Sim(3) の逆行列**であり、提案手法の出力ではない。
# 作り方と来歴は output/GT_A/room_0_manifest.json にある。
# R30 §4 手順3：参照の標本をシード固定した版（比較用。既定は変えない）
source:
  type: points_ply
  mesh_path: output/GT_A/room_0_source.ply
reference:
  type: replica_gt
  mesh_path: data/replica/room_0/habitat/mesh_semantic.ply
  info_path: data/replica/room_0/habitat/info_semantic.json
  n_points: 200000
  keep_classes:
  - wall
  - floor
  - ceiling
  - door
  - window
  gravity_dir_for_eval:
  - 0.0036468247
  - 0.0030083838
  - -0.99998885
  seed: 0
classes:
  names:
  - background
  - wall
  - door
  - floor
  - window
  - ceiling
  palette:
    background:
    - 128
    - 128
    - 128
    wall:
    - 255
    - 64
    - 64
    door:
    - 255
    - 200
    - 64
    floor:
    - 180
    - 220
    - 255
    window:
    - 64
    - 200
    - 255
    ceiling:
    - 200
    - 100
    - 255
  replica_to_six:
    93: wall
    37: door
    40: floor
    97: window
    31: ceiling
  structural:
  - wall
  - floor
  - ceiling
  match_classes:
  - wall
  - floor
  - ceiling
  - door
  - window
preprocess:
  voxel_size: 0.05
  normal_radius: 0.15
  normal_max_nn: 50
rotation:
  ransac_iters: 1000
  ransac_normal_thresh_deg: 5.0
  yaw_bins: 360
  yaw_use_kmeans: true
semantic_icp:
  max_iter: 50
  max_corr_dist: 0.3
  tukey_c: 0.3
  with_scaling: true
  rotation_fixed: false
  convergence_delta: 1.0e-05
baseline_open3d:
  voxel_size: 0.05
  fpfh_radius: 0.25
  fpfh_max_nn: 100
  ransac_dist: 0.075
  ransac_n: 4
  ransac_iters: 4000000
  ransac_confidence: 0.999
  icp_dist: 0.15
eval:
  trials: 100
  seed: 0
  perturb:
    rot_deg:
    - 0.0
    - 180.0
    trans:
    - -2.0
    - 2.0
    log_scale:
    - -0.4
    - 0.4
  success:
    rot_deg: 5.0
    trans: 0.1
    scale_ratio: 0.05
  success_strict:
    rot_deg: 1.0
    trans: 0.05
    scale_ratio: 0.02
  out_dir: output/Registration/gt_a/room_0
  t_gt_path: output/GT_A/T_gt_room_0.json
adopted_method: proposed
