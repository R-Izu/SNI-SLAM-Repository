# 実データ・シーンマニフェスト
#
# 指示書 00_Coordination/Instructions/2026-08-17_r4_realdata_slam_execution.md §3 のスキーマ。
# preflight.* の値は S0 事前フライトチェックの実測値
#   (output/RealData/_preflight/preflight_all.csv, 2026-08-17, commit 88d6ab3 + tools/realdata)。
#
# ★未確定★ -----------------------------------------------------------------
# covers（どのスキャンが 411 / 410 / 廊下 か）は **計測から決められないため未確定**。
# 指示書 §1 変更1 が想定した内訳（411単体3・410単体2・411+廊下2・411+410 2・411+410+廊下1）と
# 実測の規模が一致しない：
#   - 単室規模（床 α-shape ≈ 35 m2）は **2 本しかない**（想定は 3+2=5 本）
#   - 4 本は直線方向に 37〜44 m 移動しており、教室 2 室ではなく**フロア規模の廊下走査**
#   - 残り 4 本も床 α-shape 119〜183 m2 で、複数室にまたがる
# したがって scene 名は**測定された規模から付けた暫定名**であり、411/410 を主張していない。
# main の回答（どの scan_id がどの部屋か）を得てから確定させること。
# --------------------------------------------------------------------------

meta:
