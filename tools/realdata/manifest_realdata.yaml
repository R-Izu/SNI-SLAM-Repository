  preflight_date: 2026-08-17
  # 逆投影の条件（面積・天井判定の再現に必要）
  preflight_params: {frame_stride: 15, pix_stride: 2, conf_min: 1, max_depth_m: 8.0, alpha_m: 0.5}
  pose_convention: opencv   # 10 本すべてで OpenCV 解釈が OpenGL 解釈より NN 距離が小さい
  scene_names_provisional: true

